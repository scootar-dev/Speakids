name: speakids-pronunciation
services:
  pronunciation:
    image: ${SPEAKIDS_IMAGE:?Set SPEAKIDS_IMAGE to a GHCR image digest}
    env_file: .env
    ports:
      - "127.0.0.1:${SPEAKIDS_PORT:-18080}:8000"
    volumes:
      - ./model_cache:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${SPEAKIDS_MEMORY:-4g}
    cpus: ${SPEAKIDS_CPUS:-2.0}
    pids_limit: 256
    environment:
      OMP_NUM_THREADS: "2"
      HF_HUB_OFFLINE: "1"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 8
