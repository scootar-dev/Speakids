name: Build & Release SpeaKids
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Setup Java & Flutter untuk build APK Android ---
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android APK
        run: |
          flutter pub get
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/SpeaKids.apk

      # --- Buat ZIP distribusi untuk PC/Web (tanpa file build/dev) ---
      - name: Package SpeaKids Web/PC ZIP
        run: |
          mkdir -p dist
          rsync -av --progress . dist/SpeaKids/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.dart_tool' \
            --exclude='build' \
            --exclude='android' \
            --exclude='dist' \
            --exclude='.gitignore' \
            --exclude='pubspec.lock' \
            --exclude='pronunciation_backend/.pytest_cache' \
            --exclude='pronunciation_backend/.venv' \
            --exclude='pronunciation_backend/model_cache' \
            --exclude='pronunciation_backend/app/__pycache__' \
            --exclude='pronunciation_backend/tests/__pycache__' \
            --exclude='test'
          cd dist
          zip -r SpeaKids.zip SpeaKids/

      # --- Upload sebagai GitHub Actions Artifact (bisa diunduh dari tab Actions) ---
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeaKids-Android-APK
          path: dist/SpeaKids.apk
          retention-days: 90

      - name: Upload Web/PC ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeaKids-Web-PC
          path: dist/SpeaKids.zip
          retention-days: 90

      # --- Buat Release otomatis dengan tag tanggal (bisa diunduh dari tab Releases) ---
      - name: Generate release tag
        id: tag
        run: echo "tag=v$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "SpeaKids ${{ steps.tag.outputs.tag }}"
          body: |
            ## 📦 Download SpeaKids

            ### 📱 Untuk HP Android:
            1. Download file **`SpeaKids.apk`** di bawah (bukan yang `.zip`)
            2. Tap file **`SpeaKids.apk`** yang sudah terunduh untuk langsung menginstal (tidak perlu ekstrak)
            3. Jika muncul peringatan izin, aktifkan *"Izinkan dari sumber ini"* (*Install unknown apps*)

            ### 💻 Untuk Komputer (Windows / Web):
            1. Download **`SpeaKids.zip`** lalu ekstrak
            2. Klik dua kali **`Jalankan-Web.cmd`** (butuh Node.js)

            ---
            *Build otomatis dari commit ${{ github.sha }}*
          files: |
            dist/SpeaKids.apk
            dist/SpeaKids.zip
          generate_release_notes: true
